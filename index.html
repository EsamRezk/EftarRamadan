<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مسابقة إفطار العائلة 🌙</title>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Tajawal:wght@300;400;700;900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root {
  --gold: #D4AF37;
  --gold-light: #F5D76E;
  --gold-dark: #9A7D0A;
  --navy: #0A0F2E;
  --navy-mid: #111736;
  --navy-light: #1a2050;
  --cream: #FFF8E7;
  --emerald: #1B6B4A;
  --text-light: #F0E6C8;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: 'Tajawal', sans-serif;
  background: var(--navy);
  color: var(--text-light);
  min-height: 100vh;
  overflow-x: hidden;
  position: relative;
}

.stars {
  position: fixed;
  top: 0; left: 0;
  width: 100%; height: 100%;
  pointer-events: none;
  z-index: 0;
}

.star {
  position: absolute;
  background: white;
  border-radius: 50%;
  animation: twinkle var(--dur, 3s) infinite;
}

@keyframes twinkle {
  0%, 100% { opacity: 0.2; transform: scale(1); }
  50% { opacity: 1; transform: scale(1.3); }
}

.crescent {
  position: fixed;
  top: -60px; left: -60px;
  width: 220px; height: 220px;
  border-radius: 50%;
  box-shadow: 50px 60px 0 var(--gold);
  opacity: 0.15;
  pointer-events: none;
  z-index: 0;
}

.pattern-overlay {
  position: fixed;
  top: 0; left: 0;
  width: 100%; height: 100%;
  opacity: 0.03;
  background-image:
    repeating-linear-gradient(45deg, var(--gold) 0px, var(--gold) 1px, transparent 1px, transparent 20px),
    repeating-linear-gradient(-45deg, var(--gold) 0px, var(--gold) 1px, transparent 1px, transparent 20px);
  pointer-events: none;
  z-index: 0;
}

.container {
  position: relative;
  z-index: 1;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
}

.card {
  background: linear-gradient(145deg, var(--navy-mid), var(--navy-light));
  border: 1px solid rgba(212, 175, 55, 0.3);
  border-radius: 24px;
  padding: 40px 28px;
  max-width: 540px;
  width: 100%;
  box-shadow:
    0 0 60px rgba(212, 175, 55, 0.08),
    0 20px 60px rgba(0,0,0,0.5),
    inset 0 1px 0 rgba(212, 175, 55, 0.2);
  animation: cardIn 0.6s ease-out;
  overflow: hidden;
}

@keyframes cardIn {
  from { opacity: 0; transform: translateY(30px); }
  to { opacity: 1; transform: translateY(0); }
}

.gold-divider {
  width: 80px;
  height: 2px;
  background: linear-gradient(90deg, transparent, var(--gold), transparent);
  margin: 16px auto;
}

.icon-moon {
  font-size: 64px;
  text-align: center;
  display: block;
  margin-bottom: 10px;
  animation: float 3s ease-in-out infinite;
  filter: drop-shadow(0 0 20px rgba(212, 175, 55, 0.5));
}

@keyframes float {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-10px); }
}

h1 {
  font-family: 'Amiri', serif;
  font-size: 2rem;
  text-align: center;
  color: var(--gold);
  text-shadow: 0 0 30px rgba(212, 175, 55, 0.4);
  line-height: 1.4;
}

.subtitle {
  text-align: center;
  color: rgba(240, 230, 200, 0.6);
  font-size: 0.9rem;
  margin-top: 6px;
}

.input-group { margin-top: 28px; }

.input-group label {
  display: block;
  color: var(--gold-light);
  font-size: 0.9rem;
  margin-bottom: 10px;
  font-weight: 700;
  letter-spacing: 1px;
}

.input-group input {
  width: 100%;
  padding: 14px 18px;
  background: rgba(255,255,255,0.05);
  border: 1px solid rgba(212, 175, 55, 0.3);
  border-radius: 12px;
  color: white;
  font-family: 'Tajawal', sans-serif;
  font-size: 1.1rem;
  outline: none;
  transition: all 0.3s;
  text-align: right;
}

.input-group input:focus {
  border-color: var(--gold);
  background: rgba(212, 175, 55, 0.08);
  box-shadow: 0 0 20px rgba(212, 175, 55, 0.15);
}

.btn {
  width: 100%;
  padding: 16px;
  margin-top: 20px;
  background: linear-gradient(135deg, var(--gold-dark), var(--gold), var(--gold-light));
  color: var(--navy);
  border: none;
  border-radius: 12px;
  font-family: 'Tajawal', sans-serif;
  font-size: 1.1rem;
  font-weight: 900;
  cursor: pointer;
  transition: all 0.3s;
  letter-spacing: 1px;
  position: relative;
  overflow: hidden;
}

.btn::before {
  content: '';
  position: absolute;
  top: 0; left: -100%;
  width: 100%; height: 100%;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
  transition: left 0.5s;
}

.btn:hover::before { left: 100%; }
.btn:hover { transform: translateY(-2px); box-shadow: 0 10px 30px rgba(212, 175, 55, 0.4); }
.btn:active { transform: translateY(0); }
.btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

/* Question screen */
.question-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 24px;
}

.q-badge {
  background: rgba(212, 175, 55, 0.15);
  border: 1px solid rgba(212, 175, 55, 0.4);
  color: var(--gold);
  padding: 6px 14px;
  border-radius: 50px;
  font-size: 0.82rem;
  font-weight: 700;
  white-space: nowrap;
}

.progress-dots {
  display: flex;
  gap: 4px;
  flex-wrap: nowrap;
}

.dot {
  width: 7px; height: 7px;
  border-radius: 50%;
  background: rgba(212, 175, 55, 0.2);
  border: 1px solid rgba(212, 175, 55, 0.3);
  transition: all 0.4s;
  flex-shrink: 0;
}

.dot.active {
  background: var(--gold);
  box-shadow: 0 0 8px rgba(212, 175, 55, 0.6);
}

.dot.done {
  background: var(--emerald);
  border-color: var(--emerald);
}

.question-text {
  font-family: 'Amiri', serif;
  font-size: 1.35rem;
  line-height: 1.7;
  color: var(--cream);
  margin-bottom: 24px;
  text-align: center;
  min-height: 80px;
}

.options-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  margin-bottom: 16px;
}

.option-btn {
  padding: 14px 10px;
  background: rgba(255,255,255,0.04);
  border: 1px solid rgba(212, 175, 55, 0.2);
  border-radius: 14px;
  color: var(--text-light);
  font-family: 'Tajawal', sans-serif;
  font-size: 0.95rem;
  cursor: pointer;
  transition: all 0.25s;
  text-align: center;
  line-height: 1.4;
}

.option-btn:hover:not(:disabled) {
  background: rgba(212, 175, 55, 0.1);
  border-color: var(--gold);
  transform: scale(1.02);
}

.option-btn.correct {
  background: rgba(27, 107, 74, 0.4);
  border-color: #2ECC71;
  color: #2ECC71;
  animation: pulse-green 0.5s ease;
}

.option-btn.wrong {
  background: rgba(192, 57, 43, 0.3);
  border-color: #E74C3C;
  color: #E74C3C;
  animation: shake 0.4s ease;
}

.option-btn.reveal {
  background: rgba(27, 107, 74, 0.2);
  border-color: rgba(46, 204, 113, 0.4);
  color: rgba(46, 204, 113, 0.8);
}

@keyframes pulse-green {
  0% { transform: scale(1); }
  50% { transform: scale(1.05); box-shadow: 0 0 20px rgba(46,204,113,0.5); }
  100% { transform: scale(1); }
}

@keyframes shake {
  0%, 100% { transform: translateX(0); }
  25% { transform: translateX(-6px); }
  75% { transform: translateX(6px); }
}

.feedback-msg {
  text-align: center;
  font-size: 0.95rem;
  font-weight: 700;
  min-height: 36px;
  padding: 8px;
  border-radius: 10px;
  transition: all 0.3s;
}

.feedback-msg.correct { color: #2ECC71; }
.feedback-msg.wrong { color: #E74C3C; }

.score-circles {
  display: flex;
  justify-content: center;
  flex-wrap: wrap;
  gap: 6px;
  margin: 12px 0;
}

.score-circle {
  width: 28px; height: 28px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 0.85rem;
}

/* Invitation screen */
.invitation-card {
  background: linear-gradient(145deg, rgba(212,175,55,0.1), rgba(212,175,55,0.03));
  border: 1px solid rgba(212, 175, 55, 0.5);
  border-radius: 20px;
  padding: 28px 20px;
  text-align: center;
  margin: 16px 0;
  position: relative;
  overflow: hidden;
}

.invitation-card::before {
  content: '✦';
  position: absolute;
  top: 10px; right: 14px;
  color: var(--gold);
  opacity: 0.4;
  font-size: 1.3rem;
}

.invitation-card::after {
  content: '✦';
  position: absolute;
  bottom: 10px; left: 14px;
  color: var(--gold);
  opacity: 0.4;
  font-size: 1.3rem;
}

.invitation-name {
  font-family: 'Amiri', serif;
  font-size: 1.6rem;
  color: var(--gold);
  margin-bottom: 6px;
}

.invitation-body {
  font-family: 'Amiri', serif;
  font-size: 1rem;
  line-height: 1.8;
  color: var(--cream);
}

.invitation-detail {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  margin: 8px 0;
  font-size: 0.95rem;
  flex-wrap: wrap;
}

.invitation-detail .icon { font-size: 1.1rem; }
.invitation-detail .detail-label { color: var(--gold-light); font-weight: 700; }
.invitation-detail .detail-val { color: var(--cream); }

/* Leaderboard */
.leaderboard-table {
  width: 100%;
  border-collapse: collapse;
  margin-top: 16px;
  table-layout: fixed;
}

.leaderboard-table th {
  color: var(--gold);
  font-size: 0.82rem;
  padding: 8px 4px;
  border-bottom: 1px solid rgba(212,175,55,0.2);
  text-align: right;
}

.leaderboard-table th:nth-child(1) { width: 36px; text-align: center; }
.leaderboard-table th:nth-child(2) { width: auto; }
.leaderboard-table th:nth-child(3) { width: 90px; text-align: center; }

.leaderboard-table td {
  padding: 10px 4px;
  border-bottom: 1px solid rgba(255,255,255,0.05);
  font-size: 0.85rem;
  color: var(--text-light);
  vertical-align: middle;
}

.leaderboard-table td:nth-child(1) { text-align: center; }
.leaderboard-table td:nth-child(3) { text-align: center; }

/* النجوم تتكسر في سطرين بدل ما تطلع بره */
.stars-cell {
  display: block;
  font-size: 0.75rem;
  line-height: 1.4;
  word-break: break-all;
  overflow-wrap: anywhere;
}

.score-text {
  font-size: 0.85rem;
  font-weight: 700;
  display: block;
}

.rank-badge {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 26px; height: 26px;
  border-radius: 50%;
  font-size: 0.8rem;
  font-weight: 700;
}

.rank-1 { background: var(--gold); color: var(--navy); }
.rank-2 { background: #A8A9AD; color: var(--navy); }
.rank-3 { background: #CD7F32; color: white; }
.rank-other { background: rgba(255,255,255,0.1); color: var(--text-light); }

.screen { display: none; }
.screen.active { display: block; }

.tab-row {
  display: flex;
  gap: 10px;
  margin-top: 20px;
}

.tab-btn {
  flex: 1;
  padding: 12px 8px;
  background: rgba(255,255,255,0.05);
  border: 1px solid rgba(212, 175, 55, 0.2);
  border-radius: 10px;
  color: var(--text-light);
  font-family: 'Tajawal', sans-serif;
  font-size: 0.85rem;
  cursor: pointer;
  transition: all 0.3s;
}

.tab-btn:hover, .tab-btn.active {
  background: rgba(212, 175, 55, 0.15);
  border-color: var(--gold);
  color: var(--gold);
}

.loading {
  text-align: center;
  padding: 30px;
  color: rgba(212, 175, 55, 0.6);
  font-size: 0.95rem;
}

.confetti-container {
  position: fixed;
  top: 0; left: 0;
  width: 100%; height: 100%;
  pointer-events: none;
  z-index: 100;
}

.confetti-piece {
  position: absolute;
  width: 8px; height: 8px;
  border-radius: 2px;
  animation: confettiFall linear forwards;
  top: -10px;
}

@keyframes confettiFall {
  to { transform: translateY(110vh) rotate(720deg); opacity: 0; }
}
</style>
</head>

function generateStars() {
  const container = document.getElementById('stars');
  for (let i = 0; i < 80; i++) {
    const s = document.createElement('div');
    s.className = 'star';
    const size = Math.random() * 2.5 + 0.5;
    s.style.cssText = `width:${size}px;height:${size}px;left:${Math.random()*100}%;top:${Math.random()*100}%;--dur:${Math.random()*4+2}s;animation-delay:${Math.random()*4}s;`;
    container.appendChild(s);
  }
}

function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

async function startQuiz() {
  const name = document.getElementById('nameInput').value.trim();
  const errorEl = document.getElementById('nameError');
  const btn = document.getElementById('startBtn');

  errorEl.style.display = 'none';
  document.getElementById('nameInput').style.borderColor = '';

  if (!name) {
    document.getElementById('nameInput').style.borderColor = '#E74C3C';
    errorEl.textContent = '⚠️ من فضلك اكتب اسمك الكريم';
    errorEl.style.display = 'block';
    return;
  }

  const isAdmin = name === ADMIN_NAME;

  if (!isAdmin && useDB) {
    btn.textContent = '⏳ جاري التحقق...';
    btn.disabled = true;
    try {
      const { data } = await sbClient.from('quiz_results').select('id').ilike('name', name).limit(1);
      if (data && data.length > 0) {
        errorEl.innerHTML = `⛔ الاسم <strong>"${escHtml(name)}"</strong> مسجّل مسبقاً<br><span style="font-size:0.85rem; opacity:0.8;">كل شخص يلعب مرة واحدة فقط 🌙</span>`;
        errorEl.style.display = 'block';
        document.getElementById('nameInput').style.borderColor = '#E74C3C';
        btn.textContent = 'ابدأ المسابقة ✨';
        btn.disabled = false;
        return;
      }
    } catch(e) { console.log('Check error:', e); }
    btn.textContent = 'ابدأ المسابقة ✨';
    btn.disabled = false;
  }

  userName = name;
  document.getElementById('leaderboardBtnRow').style.display = isAdmin ? 'flex' : 'none';
  currentQ = 0; score = 0; answers = [];
  loadQuestion();
  showScreen('screen-question');
}

function loadQuestion() {
  const q = questions[currentQ];
  answered = false;
  document.getElementById('qBadge').textContent = `السؤال ${currentQ + 1} من ${questions.length}`;
  document.getElementById('questionText').textContent = q.q;
  document.getElementById('feedbackMsg').textContent = '';
  document.getElementById('feedbackMsg').className = 'feedback-msg';

  for (let i = 0; i < questions.length; i++) {
    const dot = document.getElementById(`dot-${i}`);
    dot.className = 'dot';
    if (i < currentQ) dot.classList.add('done');
    if (i === currentQ) dot.classList.add('active');
  }

  const sc = document.getElementById('scoreCircles');
  sc.innerHTML = answers.map(a =>
    `<div class="score-circle" style="background:${a?'rgba(27,107,74,0.5)':'rgba(192,57,43,0.3)'};border:1px solid ${a?'#2ECC71':'#E74C3C'}">${a?'✅':'❌'}</div>`
  ).join('');

  const grid = document.getElementById('optionsGrid');
  grid.innerHTML = '';
  q.options.forEach((opt, i) => {
    const btn = document.createElement('button');
    btn.className = 'option-btn';
    btn.textContent = opt;
    btn.onclick = () => selectAnswer(i, btn);
    grid.appendChild(btn);
  });
}

function selectAnswer(idx, btnEl) {
  if (answered) return;
  answered = true;

  const q = questions[currentQ];
  const btns = document.querySelectorAll('.option-btn');
  btns.forEach(b => b.disabled = true);

  const isCorrect = idx === q.correct;
  if (isCorrect) {
    score++;
    btnEl.classList.add('correct');
    document.getElementById('feedbackMsg').textContent = '✅ إجابة صحيحة! أحسنت';
    document.getElementById('feedbackMsg').className = 'feedback-msg correct';
  } else {
    btnEl.classList.add('wrong');
    btns[q.correct].classList.add('reveal');
    document.getElementById('feedbackMsg').innerHTML = `❌ الإجابة الصحيحة: ${q.options[q.correct]}<br><small style="opacity:0.8;font-size:0.82rem;">${q.explanation}</small>`;
    document.getElementById('feedbackMsg').className = 'feedback-msg wrong';
  }

  answers.push(isCorrect);

  setTimeout(() => {
    currentQ++;
    if (currentQ < questions.length) {
      loadQuestion();
    } else {
      showResult();
    }
  }, 2200);
}

async function showResult() {
  const titles = ['حاول مرة أخرى! 💪', 'مش بطال! 👍', 'كويس! 😊', 'ممتاز! أحسنت 👏', 'رائع جداً! 🌟', 'رائع جداً! 🌟', 'رائع جداً! 🌟', 'مثالي تقريباً! 💫', 'مثالي تقريباً! 💫', 'مثالي تقريباً! 💫', 'مثالي! ما شاء الله! 🏆'];
  
  const messages = [
  { range: [0, 3], texts: [
    'إنت دخلت تحمّي بس ولا إيه؟ 😅 ركّز شوية وهتشوف الفرق!',
    'واضح إنك جاوبت وانت مستعجل على الشاي 😂 جرب تاني واديها تركيز أكتر!'
  ]},
  { range: [4, 6], texts: [
    'أداء معقول 👌 بس لسه في حتة كدا ناقصة تزبيط بسيط.',
    'ماشي الحال 😄 انت في السليم… بس لو ركزت سنة صغيرة هتعلى جامد!'
  ]},
  { range: [7, 9], texts: [
    'جامد جدًا 👏 واضح إنك فاهم اللعبة صح!',
    'شغل عالي 👌 كده الناس هتبدأ تسألك إنت ذاكرت فين!'
  ]},
  { range: [10, 15], texts: [
    'الله عليك 👑 ده إنت حافظ المنهج من الجلدة للجلدة!',
    'فوق الممتاز 🔥 كده احنا نخاف منك في المسابقات الجاية!'
  ]}
];

  let selectedMsg = 'يسعدنا دعوتك لإفطار العائلة';
  for (let msg of messages) {
    if (score >= msg.range[0] && score <= msg.range[1]) {
      selectedMsg = msg.texts[Math.floor(Math.random() * msg.texts.length)];
      break;
    }
  }

  document.getElementById('resultTitle').textContent = titles[score];
  document.getElementById('scoreBig').textContent = `${score} / ${questions.length}`;
  document.getElementById('invName').textContent = `أهلاً بك يا ${userName} 🌙`;
  
  const invBody = document.querySelector('.invitation-body');
  if (invBody) {
    invBody.innerHTML = `${selectedMsg}
        <div class="invitation-detail">
          <span class="icon">📅</span>
          <span class="detail-label">التاريخ:</span>
          <span class="detail-val">الاثنين ٢٣ فبراير</span>
        </div>
        <div class="invitation-detail">
          <span class="icon">🕌</span>
          <span class="detail-label">المكان:</span>
          <span class="detail-val"><a href="https://maps.app.goo.gl/2eExAc16hfzRPNFq6" target="_blank" style="color:var(--gold-light); text-decoration:underline; font-weight:700;">فندق ALMA 📍</a></span>
        </div>
        <div class="invitation-detail">
          <span class="icon">🌙</span>
          <span class="detail-label">المناسبة:</span>
          <span class="detail-val">إفطار رمضان المبارك</span>
        </div>`;
  }

  showScreen('screen-result');

  const isAdmin = userName === ADMIN_NAME;
  const adminRow = document.getElementById('adminLeaderboardRow');
  if (adminRow) adminRow.style.display = isAdmin ? 'flex' : 'none';

  if (score === questions.length) launchConfetti();

  if (useDB) {
    try {
      await sbClient.from('quiz_results').insert({
        name: userName, score, total: questions.length,
        created_at: new Date().toISOString()
      });
    } catch(e) { console.log('DB save error', e); }
  } else {
    const results = JSON.parse(localStorage.getItem('quiz_results') || '[]');
    results.push({ name: userName, score, total: questions.length, created_at: new Date().toISOString() });
    localStorage.setItem('quiz_results', JSON.stringify(results));
  }
}

async function showLeaderboard() {
  if (userName !== ADMIN_NAME) return;
  showScreen('screen-leaderboard');
  await loadLeaderboard();
}

async function loadLeaderboard() {
  const el = document.getElementById('leaderboardContent');
  el.innerHTML = '<div class="loading">⏳ جاري التحميل...</div>';

  let results = [];

  if (useDB) {
    try {
      const { data, error } = await sbClient
        .from('quiz_results').select('*')
        .order('score', { ascending: false })
        .order('created_at', { ascending: true });
      if (!error) results = data || [];
    } catch(e) {}
  } else {
    results = JSON.parse(localStorage.getItem('quiz_results') || '[]');
    results.sort((a,b) => b.score - a.score || new Date(a.created_at) - new Date(b.created_at));
  }

  if (results.length === 0) {
    el.innerHTML = '<p style="text-align:center;color:rgba(240,230,200,0.4);padding:30px;">لا توجد نتائج بعد 🌙<br>كن أول المشاركين!</p>';
    return;
  }

  const medals = ['🥇','🥈','🥉'];
  const rankClass = i => i===0?'rank-1':i===1?'rank-2':i===2?'rank-3':'rank-other';

  // حساب عدد النجوم بشكل يناسب الموبايل
  const starsHtml = (n) => {
    if (n <= 5) return '⭐'.repeat(n);
    return '⭐'.repeat(5) + '<br>' + '⭐'.repeat(n - 5);
  };

  el.innerHTML = `
    <table class="leaderboard-table">
      <thead>
        <tr>
          <th>#</th>
          <th>الاسم</th>
          <th>النتيجة</th>
        </tr>
      </thead>
      <tbody>
        ${results.map((r, i) => `
          <tr>
            <td><span class="rank-badge ${rankClass(i)}">${i < 3 ? medals[i] : i+1}</span></td>
            <td>
              <div style="font-size:0.9rem;font-weight:${i===0?'700':'400'};color:${i===0?'var(--gold)':'var(--text-light)'};">${escHtml(r.name)}</div>
              <div style="font-size:0.72rem;opacity:0.5;margin-top:2px;">🕐 ${formatDate(r.created_at)}</div>
            </td>
            <td>
              <span class="score-text" style="color:${r.score===10?'var(--gold)':r.score>=7?'#2ECC71':'rgba(240,230,200,0.7)'};">${r.score} / ${r.total}</span>
              <span class="stars-cell">${starsHtml(r.score)}</span>
            </td>
          </tr>
        `).join('')}
      </tbody>
    </table>
    ${!useDB ? '<p style="text-align:center;margin-top:16px;font-size:0.8rem;color:rgba(212,175,55,0.5);">⚠️ وضع المعاينة - بيانات محلية</p>' : ''}
  `;
}

function formatDate(d) {
  if (!d) return '';
  return new Date(d).toLocaleTimeString('ar-SA', { hour: '2-digit', minute: '2-digit' });
}

function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function launchConfetti() {
  const colors = ['#D4AF37','#F5D76E','#2ECC71','#3498DB','#E74C3C','#9B59B6'];
  const container = document.getElementById('confetti');
  for (let i = 0; i < 80; i++) {
    const c = document.createElement('div');
    c.className = 'confetti-piece';
    c.style.cssText = `left:${Math.random()*100}%;background:${colors[Math.floor(Math.random()*colors.length)]};animation-duration:${Math.random()*2+1.5}s;animation-delay:${Math.random()*1}s;width:${Math.random()*10+4}px;height:${Math.random()*10+4}px;border-radius:${Math.random()>0.5?'50%':'2px'};`;
    container.appendChild(c);
    setTimeout(() => c.remove(), 4000);
  }
}

document.getElementById('nameInput').addEventListener('input', function() {
  const val = this.value.trim();
  const isAdmin = val === ADMIN_NAME;
  document.getElementById('leaderboardBtnRow').style.display = isAdmin ? 'flex' : 'none';
  if (isAdmin) userName = val;
});

generateStars();
</script>
